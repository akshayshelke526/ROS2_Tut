<!DOCTYPE html>
<html>
<head>
    <title>ROS 2 Turtlesim Controller</title>

    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            margin-top: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        button {
            width: 100px;
            height: 60px;
            font-size: 20px;
            cursor: pointer;
        }

        .status {
            margin-top: 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🐢 ROS 2 Turtlesim Controller</h1>

    <div class="status" id="status">
        Connecting...
    </div>

    <div class="controls">

        <div></div>

        <button onclick="move(1,0)">
            ↑
        </button>

        <div></div>

        <button onclick="move(0,1)">
            ←
        </button>

        <button onclick="stop()">
            STOP
        </button>

        <button onclick="move(0,-1)">
            →
        </button>

        <div></div>

        <button onclick="move(-1,0)">
            ↓
        </button>

        <div></div>

    </div>

<script>

    // CHANGE THIS IP ADDRESS
    const ros = new ROSLIB.Ros({
        url: 'ws://10.0.2.15:9090'
    });

    ros.on('connection', function() {
        document.getElementById('status').innerHTML =
            '🟢 Connected to ROS 2';
    });

    ros.on('error', function(error) {
        document.getElementById('status').innerHTML =
            '🔴 ROS connection error';
        console.log(error);
    });

    ros.on('close', function() {
        document.getElementById('status').innerHTML =
            '🔴 Connection closed';
    });


    const cmdVel = new ROSLIB.Topic({
        ros: ros,
        name: '/turtle1/cmd_vel',
        messageType: 'geometry_msgs/msg/Twist'
    });


    function move(linear, angular) {

        const twist = new ROSLIB.Message({
            linear: {
                x: linear,
                y: 0,
                z: 0
            },

            angular: {
                x: 0,
                y: 0,
                z: angular
            }
        });

        cmdVel.publish(twist);
    }


    function stop() {

        const twist = new ROSLIB.Message({
            linear: {
                x: 0,
                y: 0,
                z: 0
            },

            angular: {
                x: 0,
                y: 0,
                z: 0
            }
        });

        cmdVel.publish(twist);
    }

</script>

</body>
</html>
